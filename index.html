<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ביצוע משימות אמתי</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b6e5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="משימות">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: desktop = side menu + main area (+ detail drawer); phone = one column, bottom tabs, floating + button, bottom sheets. */
:root {
  --bg: #f2f5f3;
  --surface: #ffffff;
  --surface-2: #f7f9f8;
  --ink: #17201e;
  --muted: #687571;
  --line: #e2e7e4;
  --accent: #2b6e5b;
  --accent-ink: #ffffff;
  --accent-soft: #dfeee8;
  --p3: #d1453b;
  --p2: #e08a1e;
  --p1: #3a73c9;
  --late: #c2410c;
  --now: #e5484d;
  --shadow: 0 1px 2px rgba(20,40,34,.06), 0 4px 14px rgba(20,40,34,.06);
  --shadow-lg: 0 10px 40px rgba(10,25,20,.18);
  --display: "Rubik", "Segoe UI", Arial, sans-serif;
  --body: "Assistant", "Segoe UI", Arial, sans-serif;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --surface: #1a201e; --surface-2: #151b19; --ink: #e7edea; --muted: #94a29d; --line: #2a3330;
    --accent: #66c2a4; --accent-ink: #0b1411; --accent-soft: #1f342d; --p3: #f0706a; --p2: #f2a54a; --p1: #6fa0ec; --late: #f08a5d;
    --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 10px 40px rgba(0,0,0,.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --surface: #1a201e; --surface-2: #151b19; --ink: #e7edea; --muted: #94a29d; --line: #2a3330;
  --accent: #66c2a4; --accent-ink: #0b1411; --accent-soft: #1f342d; --p3: #f0706a; --p2: #f2a54a; --p1: #6fa0ec; --late: #f08a5d;
  --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 10px 40px rgba(0,0,0,.5); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); height: 100%; }
.side { background: var(--surface-2); border-inline-end: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 12px; gap: 4px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 16px; font-family: var(--display); font-weight: 700; font-size: 20px; }
.brand .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.nav { display: flex; align-items: center; gap: 10px; border: 0; background: none; border-radius: 10px; padding: 9px 10px; text-align: start; width: 100%; color: var(--ink); font-weight: 600; }
.nav:hover { background: var(--line); }
.nav[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
.nav .cnt { margin-inline-start: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }
.nav[aria-current="true"] .cnt { color: var(--accent); }
.side h3 { font-family: var(--display); font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; margin: 18px 10px 4px; display: flex; justify-content: space-between; align-items: center; }
.side h3 button { border: 0; background: none; color: var(--muted); padding: 2px; border-radius: 6px; display: grid; }
.side h3 button:hover { color: var(--accent); background: var(--line); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--c, var(--muted)); }
.side .spacer { flex: 1; }
.side .tip { font-size: 12.5px; color: var(--muted); padding: 10px; line-height: 1.5; }
.kbd { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--surface); }

.main { display: flex; flex-direction: column; min-width: 0; height: 100%; overflow: hidden; position: relative; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 18px 28px 6px; }
.topbar h1 { font-family: var(--display); font-weight: 700; font-size: 26px; margin: 0; text-wrap: balance; display: flex; align-items: center; gap: 10px; min-width: 0; }
.topbar .sub { color: var(--muted); font-size: 14.5px; }
.topbar .tt { display: grid; gap: 2px; min-width: 0; flex: 1; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; height: 38px; min-width: 38px; display: inline-grid; place-items: center; padding: 0 10px; color: var(--ink); }
.iconbtn:hover { border-color: var(--accent); color: var(--accent); }
.ring { position: relative; width: 52px; height: 52px; flex: none; }
.ring svg { width: 52px; height: 52px; transform: rotate(-90deg); }
.ring .lbl { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.notice { margin: 6px 28px 0; background: color-mix(in srgb, var(--late) 14%, var(--surface)); color: var(--late); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
.notice[hidden] { display: none; }

/* composer */
.composer { margin: 10px 28px 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 6px 8px 8px; display: grid; gap: 6px; }
.composer:focus-within { border-color: var(--accent); }
.cmp-row { display: flex; align-items: center; gap: 8px; }
.cmp-row .plus { color: var(--accent); display: grid; padding-inline-start: 4px; }
.composer input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 17px; padding: 8px 2px; }
.composer input:focus { outline: none; }
.cmp-go { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 8px 16px; font-weight: 700; }
.cmp-go:disabled { opacity: .45; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
button.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"], .chip.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 700; }
.chip.parsed { background: color-mix(in srgb, var(--c, var(--accent)) 14%, var(--surface)); color: var(--c, var(--accent)); border-color: transparent; font-weight: 700; }
.chip svg.i { width: 14px; height: 14px; }
.chip .x { border: 0; background: none; padding: 0; margin-inline-start: 2px; color: inherit; display: grid; }
.cmp-hint { font-size: 12.5px; color: var(--muted); margin-inline-start: auto; }

.content { flex: 1; overflow-y: auto; padding: 8px 28px 40px; }
.content.flush { padding: 0; overflow: hidden; display: flex; }

/* sections & task rows */
.sec { margin-top: 18px; }
.sec-h { display: flex; align-items: center; gap: 8px; margin: 0 4px 8px; font-family: var(--display); font-size: 15px; font-weight: 600; }
.sec-h .n { color: var(--muted); font-weight: 500; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.sec-h .act { margin-inline-start: auto; border: 0; background: none; color: var(--accent); font-weight: 700; font-family: var(--body); font-size: 14px; padding: 2px 6px; border-radius: 6px; }
.sec-h .act:hover { background: var(--accent-soft); }
.sec-h.late { color: var(--late); }
.sec-h .fold { border: 0; background: none; padding: 0; display: inline-flex; align-items: center; gap: 6px; font: inherit; color: inherit; }
.sec-h .fold svg { transition: transform .15s; transform: rotate(-90deg); }
.sec.closed .fold svg { transform: none; }
.sec.closed .card { display: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.trow { display: flex; align-items: flex-start; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--line); position: relative; }
.trow:first-child { border-top: 0; }
.trow:hover { background: var(--surface-2); }
.trow.sel { background: var(--accent-soft); }
.cb { flex: none; width: 22px; height: 22px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--pc, var(--muted)); background: color-mix(in srgb, var(--pc, transparent) 10%, transparent); display: grid; place-items: center; padding: 0; color: transparent; transition: background .15s, border-color .15s, color .15s; }
.cb:hover { color: var(--pc, var(--muted)); }
.cb svg.i { width: 12px; height: 12px; stroke-width: 3.2; }
.p3 { --pc: var(--p3); } .p2 { --pc: var(--p2); } .p1 { --pc: var(--p1); }
.done .cb { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tmain { flex: 1; min-width: 0; border: 0; background: none; text-align: start; padding: 0; display: grid; gap: 3px; color: var(--ink); }
.ttitle { overflow-wrap: anywhere; font-size: 16px; }
.done .ttitle { text-decoration: line-through; color: var(--muted); }
.tmeta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); align-items: center; }
.tmeta span { display: inline-flex; align-items: center; gap: 4px; }
.tmeta svg.i { width: 13px; height: 13px; }
.tmeta .late { color: var(--late); font-weight: 700; }
.tmeta .soon { color: var(--accent); font-weight: 700; }
.ttime { flex: none; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; color: var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 2px 8px; margin-top: 1px; }
.trow.p1::before, .trow.p2::before, .trow.p3::before { content: ""; position: absolute; inset-block: 7px; inset-inline-start: 0; width: 4px; border-radius: 4px; background: var(--pc); }
.trow.p3 { background: color-mix(in srgb, var(--p3) 6%, var(--surface)); }
.trow.p3:hover { background: color-mix(in srgb, var(--p3) 10%, var(--surface)); }
.trow.done::before { opacity: .35; }
.grip { position: absolute; inset-inline-start: -2px; top: 50%; transform: translateY(-50%); width: 12px; height: 22px; color: var(--muted); opacity: 0; display: none; cursor: grab; }
@media (hover: hover) and (pointer: fine) { .grip { display: block; } .trow:hover .grip { opacity: .55; } }
.trow { -webkit-touch-callout: none; }
.trow.lifting { opacity: .45; transform: scale(.98); }
.laterbtn { margin-top: 18px; width: 100%; display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 14px 16px; text-align: start; color: var(--ink); }
.laterbtn:hover { border-color: var(--accent); }
.laterbtn b { font-family: var(--display); font-weight: 600; font-size: 16px; } .laterbtn span { color: var(--muted); font-size: 13.5px; }
.laterbtn .cnt { margin-inline-start: auto; background: var(--accent-soft); color: var(--accent); font-weight: 700; border-radius: 99px; padding: 2px 12px; font-variant-numeric: tabular-nums; }
.laterbtn svg.i { color: var(--accent); width: 22px; height: 22px; }
.lgrp { margin-top: 18px; } .lgrp > h3 { font-family: var(--display); font-weight: 600; font-size: 17px; margin: 0 4px 8px; display: flex; align-items: center; gap: 8px; }
.lgrp > h3 .n { color: var(--muted); font-size: 13.5px; font-weight: 500; }
.ltopic { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 8px; overflow: hidden; box-shadow: var(--shadow); }
.ltopic > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 14px; font-weight: 700; }
.ltopic > summary::-webkit-details-marker { display: none; }
.ltopic > summary svg.i { transition: transform .15s; transform: none; color: var(--muted); }
.ltopic[open] > summary svg.i { transform: rotate(-90deg); }
.ltopic > summary .n { margin-inline-start: auto; color: var(--muted); font-weight: 600; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.ltopic > .card { border: 0; border-top: 1px solid var(--line); border-radius: 0; box-shadow: none; min-height: 44px; }
.ltopic.zover-t { outline: 2px dashed var(--accent); outline-offset: 2px; }
.board.nosnap { scroll-snap-type: none; }
.boardnav { display: flex; gap: 6px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.boardnav .lbl { color: var(--muted); font-size: 13px; margin-inline-end: 4px; }
.dock details { margin-top: 8px; } .dock summary { cursor: pointer; font-weight: 700; font-size: 14px; padding: 6px 2px; display: flex; gap: 6px; align-items: center; }
.dock summary .n { color: var(--muted); font-weight: 500; margin-inline-start: auto; }
.dock .dgh { font-family: var(--display); font-size: 14px; margin: 14px 2px 2px; display: flex; gap: 6px; align-items: center; }
@media (min-width: 900px) { .colcards { max-height: calc(100vh - 330px); overflow-y: auto; } }
@media (max-width: 899px) { .deskonly { display: none !important; } }
.dropline { height: 3px; background: var(--accent); border-radius: 3px; margin: -1px 10px; position: relative; z-index: 2; }
[data-zone].zover { outline: 2px dashed var(--accent); outline-offset: 2px; }
body.ldragging, body.ldragging * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
.empty { display: grid; justify-items: center; gap: 8px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 26px 18px; }
.empty svg { width: 64px; height: 64px; }
.empty b { color: var(--ink); font-size: 16px; }

.nextup { display: flex; align-items: center; gap: 14px; background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #0b3a2e)); color: #fff; border-radius: var(--r); padding: 14px 16px; margin-top: 14px; box-shadow: var(--shadow); border: 0; width: 100%; text-align: start; }
.nextup .big { font-family: var(--display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.nextup .lbl { font-size: 13px; opacity: .85; }
.nextup .tt { font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
.nextup .nx { display: grid; gap: 1px; min-width: 0; }
:root[data-theme="dark"] .nextup { color: #0b1411; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .nextup { color: #0b1411; } }

/* projects */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 14px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; display: grid; gap: 10px; text-align: start; border-top: 4px solid var(--c); }
.pcard:hover { border-color: var(--c); }
.pcard .pn { font-family: var(--display); font-weight: 600; font-size: 17px; display: flex; align-items: center; gap: 8px; overflow-wrap: anywhere; }
.pcard .pm { font-size: 13px; color: var(--muted); }
.bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c); border-radius: 99px; }
.newproj { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 10px 12px; }
.newproj input { flex: 1; min-width: 140px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 9px; padding: 7px 10px; }
.swatches { display: flex; gap: 6px; }
.sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; background: var(--c); padding: 0; }
.sw[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--surface); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--p3); }
.btn.plain { border-color: transparent; background: none; }
.phead { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 8px; }
.phead input.pname { font-family: var(--display); font-weight: 700; font-size: 20px; border: 1px solid transparent; background: none; border-radius: 8px; padding: 2px 6px; min-width: 0; flex: 1; }
.phead input.pname:hover, .phead input.pname:focus { border-color: var(--line); background: var(--surface); outline: none; }

/* calendar */
.calwrap { display: flex; flex: 1; min-width: 0; min-height: 0; }
.cal { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.calbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 28px 10px; }
.calbar .rng { font-family: var(--display); font-weight: 600; font-size: 17px; margin-inline-end: auto; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 7px 12px; font-weight: 600; color: var(--muted); font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.calgrid { --gut: 52px; --hp: 56px; flex: 1; min-height: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr); margin: 0 20px 0 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r) var(--r) 0 0; border-bottom: 0; box-shadow: var(--shadow); overflow: hidden; }
.chead, .callday, .cgrid { display: grid; grid-template-columns: var(--gut) repeat(var(--days), minmax(0, 1fr)); }
.chead > div { padding: 8px 4px; text-align: center; border-inline-start: 1px solid var(--line); display: grid; justify-items: center; gap: 2px; }
.chead > div:first-child { border: 0; }
.chead .dn { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.chead .dd { font-family: var(--display); font-size: 19px; font-weight: 600; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.chead .today .dd { background: var(--accent); color: var(--accent-ink); }
.chead .today .dn { color: var(--accent); }
.callday { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.callday > div { border-inline-start: 1px solid var(--line); padding: 4px; min-height: 34px; display: grid; gap: 3px; align-content: start; }
.callday > div:first-child { border: 0; font-size: 11px; color: var(--muted); display: grid; place-items: center; }
.callday .over { background: var(--accent-soft); }
.adchip { display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; background: color-mix(in srgb, var(--c, var(--accent)) 16%, var(--surface)); border-inline-start: 3px solid var(--c, var(--accent)); border-radius: 6px; padding: 2px 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.adchip.done { opacity: .5; text-decoration: line-through; }
.cbody { overflow-y: auto; min-height: 0; position: relative; overscroll-behavior: contain; }
.cgrid { position: relative; }
.hours > div { height: var(--hp); font-size: 11px; color: var(--muted); text-align: center; transform: translateY(-7px); font-variant-numeric: tabular-nums; }
.hours > div:first-child { visibility: hidden; }
.col { position: relative; border-inline-start: 1px solid var(--line); background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(color-mix(in srgb, var(--line) 50%, transparent) 1px, transparent 1px); background-size: 100% var(--hp), 100% calc(var(--hp) / 2); background-position: 0 0, 0 calc(var(--hp) / 2); cursor: copy; }
.col.today { background-color: color-mix(in srgb, var(--accent) 4%, transparent); }
.col.past { background-color: color-mix(in srgb, var(--line) 25%, transparent); }

  if (!daily.length) h += '<div class="empty">' + emptyArt() + "<b>עוד אין הרגל יומי</b><span>לחץ על \"🎯 הרגל יומי\" למעלה. לכל הרגל יש כפתור להתחלה עם טיימר, גרסה מינימלית לימים קשים, ושרשרת ימים שלא כדאי לשבור.</span></div>";
  else h += '<div class="dhgrid">' + daily.map(function (hb) { return '<div class="dhwrap">' + dailyCard(hb) + '<div class="dh-tools"><button class="linkbtn" data-act="hEdit" data-h="' + esc(hb.id) + '">עריכה</button><button class="linkbtn danger" data-act="habDel" data-h="' + esc(hb.id) + '">מחיקה</button></div>' + (S.habEdit === hb.id ? habEditForm(hb) : "") + "</div>"; }).join("") + "</div>";
  h += "</section>";
  h += '<section class="sec"><div class="sec-h">' + shic("rep", "#3a73c9") + '<span>הצמדות</span><span class="n">' + (stack.length || "") + "</span></div>";
  if (!stack.length) h += '<div class="empty" style="padding:16px">עוד אין הצמדות. לחץ על "🔗 הצמדת הרגלים" למעלה.</div>';
  else h += '<div class="card chains">' + stack.map(function (hb) {
    var v = hDone(hb), sk = habitStreak(hb);
    return '<div class="chainrow' + (v ? " done" : "") + '" style="--c:' + esc(hb.color) + '"><span class="anc">אחרי ש' + esc(habitAfterLabel(hb) || "…") + '</span><span class="arr">←</span><b>' + esc(hb.name) + '</b><span class="streak' + (sk ? " on" : "") + '">' + ic("fire") + sk + '</span><button class="cb' + (v ? " on" : "") + '" data-act="habTog" data-h="' + esc(hb.id) + '" data-d="' + T() + '" aria-label="סימון">' + ic("check") + '</button><button class="del" data-act="habDel" data-h="' + esc(hb.id) + '" aria-label="מחיקה">' + ic("trash") + "</button></div>";
  }).join("") + "</div>";
  h += "</section>";
  h += '<div class="explain"><b>💡 מה עוזר להתמיד</b><p><b>שרשרת:</b> כל יום שעשית הוא עוד חוליה. אחרי כמה ימים כבר לא תרצה לשבור אותה. <b>גרסה מינימלית:</b> ביום קשה, גם 2 דקות נחשבות והרצף נשמר. העיקר לא לוותר לגמרי. <b>טיימר:</b> הכפתור "להתחיל" פותח טיימר, ובסוף ההרגל מסומן לבד. <b>תזכורת בערב:</b> אם עוד לא עשית, מסך "היום" יזכיר לך.</p></div>';
  return h;
}
function habEditForm(hb) {
  return '<div class="habform edit" data-hform="' + esc(hb.id) + '"><label>שם<input data-hf="name" value="' + esc(hb.name) + '" autocomplete="off"></label><div class="d-2"><label>דקות ביום<select data-hf="mins">' + [0, 5, 10, 15, 20, 30, 45, 60].map(function (m) { return '<option value="' + m + '"' + ((hb.mins || 0) === m ? " selected" : "") + ">" + (m ? m + " דקות" : "בלי זמן") + "</option>"; }).join("") + '</select></label><label>מתי<select data-hf="when">' + WHEN_OPTS.map(function (w) { return '<option value="' + w[0] + '"' + ((hb.when || "") === w[0] ? " selected" : "") + ">" + w[1] + "</option>"; }).join("") + '</select></label></div><label>יעד שבועי<select data-hf="goal">' + [3, 4, 5, 6, 7].map(function (n) { return '<option value="' + n + '"' + ((hb.goal || 7) === n ? " selected" : "") + ">" + n + " ימים</option>"; }).join("") + '</select></label><label>למה זה חשוב לי<input data-hf="why" value="' + esc(hb.why || "") + '" autocomplete="off"></label><button class="btn" data-act="hEdit" data-h="">סיום עריכה</button></div>';
}
function startHabitFocus(hid) {
  var hb = settingsArr("habits").filter(function (x) { return x.id === hid; })[0]; if (!hb) return;
  F.habit = hid; F.id = null; F.len = hb.mins || 15; F.left = F.len * 60; F.run = true; fEl.hidden = false; tickFocus(); clearInterval(F.iv); F.iv = setInterval(tickFocus, 1000); drawFocus();
}
function habitTodayHtml() {
  var hs = settingsArr("habits"); if (!hs.length) return "";

  var h = '<section class="sec"><div class="sec-h">' + shic("fire", "#e8590c") + '<span>ההרגלים שלי היום</span><span class="n">' + hs.filter(function (x) { return hDone(x); }).length + "/" + hs.length + '</span><button class="act" data-act="go" data-view="habits">כל ההרגלים</button></div>';
  if (daily.length) h += '<div class="dhgrid today">' + daily.map(function (hb) { return dailyCard(hb, true); }).join("") + "</div>";
  if (stack.length) h += '<div class="habchips" style="margin-top:8px">' + stack.map(function (hb) { var on = !!hDone(hb), sk = habitStreak(hb); return '<button class="habchip' + (on ? " on" : "") + '" style="--c:' + esc(hb.color) + '" data-act="habTog" data-h="' + esc(hb.id) + '" data-d="' + T() + '" aria-pressed="' + on + '"><span class="hc">' + ic("check") + "</span>" + esc(hb.name) + (habitAfterLabel(hb) ? '<span class="af">אחרי ' + esc(habitAfterLabel(hb)) + "</span>" : "") + (sk ? '<span class="fs">' + ic("fire") + sk + "</span>" : "") + "</button>"; }).join("") + "</div>";
  return h + "</section>";
}
function habitNudgeHtml() {
  if (new Date().getHours() < 17) return "";
  var miss = settingsArr("habits").filter(function (x) { return hType(x) === "daily" && !hDone(x); });
  if (!miss.length || lsGet("myday-hnudge", "") === T()) return "";
  var hb = miss[0], sk = habitStreak(hb);
  return '<div class="banner fire"><div class="tx"><b>🔥 עוד לא ' + esc(hb.name) + " היום</b><span>" + (sk ? "יש לך " + sk + " ימים ברצף. " : "") + "אפילו 2 דקות נחשבות ושומרות על הרצף." + (hb.why ? " 💡 " + esc(hb.why) : "") + '</span></div><button class="btn primary" data-act="hMinStart" data-h="' + esc(hb.id) + '">▶ 2 דקות עכשיו</button><button class="btn plain" data-act="hNudgeOff">לא היום</button></div>';
}

if (["today", "cal", "up", "projects", "more", "matrix", "habits", "week", "templates", "tags", "later", "progress", "inbox"].indexOf(v0) >= 0) S.view = v0;
var lastDay = T();
setInterval(function () {
  if (drag || !store) return;
  if (T() !== lastDay) { lastDay = T(); S.calStart = null; watchCal(); }
  if (gWanted && S.showEv && (Date.now() - calAt > 5 * 60000 || !tokOk())) { calKey = ""; watchCal(); }

}, 60000);

window.addEventListener("resize", function () { if (Math.abs(innerWidth - lastW) < 40) return; lastW = innerWidth; if (isPhone() && S.calDays === 7) { S.calDays = 3; S.calStart = T(); } if (store && !typingInPage()) render(); });

render();
connect();
